summary: >-
  RealSelf serves a real RFC 9116 security.txt on the www and apex marketing hosts. Nothing
  else on the /.well-known surface is served on any host. The API host (api.realself.com,
  an AWS API Gateway edge) answers every unmatched route — including every /.well-known/*
