apis:
- aid: realself-lead-sharing
  name: RealSelf Lead Sharing
  description: 'RealSelf Lead Sharing publishes a notification to a partner-owned HTTPS
    endpoint every time a new patient lead is created on the platform. Delivery is over
    an Amazon SNS topic subscription: the subscriber confirms the subscription once via
    the SNS SubscribeURL handshake, then receives Notification messages whose MessageText
    is a JSON-stringified lead payload — lead id, channel, consultation types, comments,
    practice, provider, prospect and treatment — together with a callback URL and a JWS
    token used to post updates back against the lead. RealSelf publishes the payload
    contract as a JSON Schema 2020-12 document and a working .NET subscriber example on
    its GitHub organization.'
  humanURL: https://github.com/RealSelf/rs-lead-sharing-subscriber-example
