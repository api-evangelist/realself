aid: realself
name: RealSelf
description: 'RealSelf is a Seattle-based consumer healthcare marketplace for elective
  aesthetic treatments — plastic surgery, cosmetic dermatology, injectables, cosmetic
  dentistry, hair restoration and vision correction. Consumers research procedures
  through community reviews, before-and-after photo galleries, doctor Q&A and the
  Worth It rating, then request consultations from the roughly 30,000 registered
  doctors and practices on the platform. RealSelf does not operate a general-purpose
  public developer program: its machine-readable surface is a partner Lead Sharing
  integration that publishes new patient leads to a subscriber over Amazon SNS, plus
  a publicly served JSON Schema registry at api.realself.com/v1/schemas covering the
  new-lead webhook payload and the internal event/page-analytics envelopes.'
